{{- if .Values.secret.create }}
# Optional bearer: stable across upgrades — an existing
# Secret is reused via lookup, otherwise one is generated once.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "skc.name" . }}-api-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skc.labels" . | nindent 4 }}
type: Opaque
data:
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-api-token" (include "skc.name" .)) }}
  token: {{ if $existing }}{{ index $existing.data "token" }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
{{- end }}
