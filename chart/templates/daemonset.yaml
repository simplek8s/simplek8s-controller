apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "skc.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skc.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: simplek8s-controller
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      # "app: simplek8s-controller" is also the label the API's admission
      # check 3 (controller pod Running) selects on.
      labels:
        app: simplek8s-controller
    spec:
      serviceAccountName: {{ include "skc.name" . }}
      hostPID: true
      priorityClassName: {{ .Values.priorityClassName }}
      # REQUIRED: without the CP toleration there is no pod on
      # control-plane nodes, and CP reboots are impossible.
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          securityContext:
            privileged: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.secret.create }}
            - name: SIMPLEK8S_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "skc.name" . }}-api-token
                  key: token
            {{- end }}
            # Chatty development logging: "debug" surfaces the staging steps
            # (mount, download, extract, write, bootloader) and config reloads.
            - name: SIMPLEK8S_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
          ports:
            - name: api
              containerPort: 8080
          volumeMounts:
            # Optional custom GPG keyring (custom repo/signed-by-a-custom
            # key). Absent Secret -> mount empty -> the embedded image
            # keyring is used (see README "Keyring override").
            - name: keyring
              mountPath: /etc/simplek8s/custom
              readOnly: true
          # Liveness must not depend on API-server reachability (3.12).
          livenessProbe:
            httpGet:
              path: /livez
              port: api
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: api
            periodSeconds: 5
      volumes:
        - name: keyring
          secret:
            secretName: simplek8s-controller-keyring
            optional: true
