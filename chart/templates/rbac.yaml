# Cluster-wide verbs: nodes, pods, evictions, PDBs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "skc.name" . }}
  labels:
    {{- include "skc.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, delete]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "skc.name" . }}
  labels:
    {{- include "skc.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "skc.name" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "skc.name" . }}
  apiGroup: rbac.authorization.k8s.io
---
# The leader Lease lives in the controller's own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "skc.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skc.labels" . | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
  # Flat-key feature ConfigMap; create/update for legacy plan-state
  # writes; delete for the self-cleaning M2 plan ConfigMap migration.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, create, update, delete]
---
# Node Events are cluster-scoped subjects: the API server requires them in
# the "default" namespace (where kubelet's own node events live) — never
# retargeted, whatever the release namespace is.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "skc.name" . }}-events
  namespace: default
  labels:
    {{- include "skc.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "skc.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skc.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "skc.name" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "skc.name" . }}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "skc.name" . }}-events
  namespace: default
  labels:
    {{- include "skc.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "skc.name" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "skc.name" . }}-events
  apiGroup: rbac.authorization.k8s.io
