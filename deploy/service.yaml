apiVersion: v1
kind: Service
metadata:
  name: simplek8s-controller
  namespace: simplek8s
spec:
  type: NodePort
  # Cluster (not Local): a NodePort hit on a node whose local pod is not
  # ready still reaches a live API (PLAN 3.9).
  externalTrafficPolicy: Cluster
  selector:
    app: simplek8s-controller
  ports:
    - name: api
      port: 8080
      targetPort: api
      nodePort: 30880
