# Flat-key feature configuration (PLAN-M2 3.2). Values are quoted
# strings: bare `off` would be a YAML 1.1 boolean and bare numbers
# would be YAML numbers, and ConfigMap data is map[string]string.
# Absent keys fall back to the built-in defaults; this file pins the
# defaults so every key is visible in one place.
apiVersion: v1
kind: ConfigMap
metadata:
  name: simplek8s-controller
  namespace: simplek8s
data:
  engine.engine-interval: 2s
  reboots.max-concurrent-reboots: "1"
  reboots.on-reboot-failure: pause
  reboots.reboot-drain-timeout: 10m
  reboots.reboot-issue-grace: 5m
  updates.update-mode: "off"
  updates.url: "https://dl.simplek8s.org/simplek8s/stable"
  updates.check-interval: 12h
  updates.preserve: "3"
  updates.max-percent-usage: "75"
