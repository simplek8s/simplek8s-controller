apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: simplek8s-controller
  namespace: simplek8s
  labels:
    app: simplek8s-controller
spec:
  selector:
    matchLabels:
      app: simplek8s-controller
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      # "app: simplek8s-controller" is also the label the API's admission
      # check 3 (controller pod Running) selects on.
      labels:
        app: simplek8s-controller
    spec:
      serviceAccountName: simplek8s-controller
      hostPID: true
      priorityClassName: system-node-critical
      # REQUIRED: without the CP toleration there is no pod on
      # control-plane nodes, and CP reboots are impossible (PLAN 3.12).
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: controller
          image: ghcr.io/simplek8s/simplek8s-controller:dev
          securityContext:
            privileged: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SIMPLEK8S_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: simplek8s-api-token
                  key: token
          ports:
            - name: api
              containerPort: 8080
          # Liveness must not depend on API-server reachability (3.12).
          livenessProbe:
            httpGet:
              path: /livez
              port: api
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: api
            periodSeconds: 5
