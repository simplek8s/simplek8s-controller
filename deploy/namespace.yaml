apiVersion: v1
kind: Namespace
metadata:
  name: simplek8s
  labels:
    # The DaemonSet is privileged + hostPID by design (nsenter reboot,
    # boot-partition mounts): enforce that explicitly so PodSecurity
    # admission does not deny the pods where a baseline is enforced.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
