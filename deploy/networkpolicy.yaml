# The plain-HTTP token is not the only wall (PLAN 3.9): this pins pod
# ingress to the API port and denies everything else. Tighten the
# (currently cluster-wide) source as the topology demands.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: simplek8s-controller
  namespace: simplek8s
spec:
  podSelector:
    matchLabels:
      app: simplek8s-controller
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
