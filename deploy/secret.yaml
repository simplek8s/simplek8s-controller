# Placeholder: Kustomize composes/injects the Secret reference but does
# NOT generate random material (PLAN 3.9). Create or override this
# Secret with securely generated content before deploying, e.g.:
#   kubectl -n simplek8s create secret generic simplek8s-api-token \
#     --from-literal=token="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: simplek8s-api-token
  namespace: simplek8s
type: Opaque
stringData:
  token: CHANGE-ME-generate-securely
