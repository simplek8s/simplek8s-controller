# Optional bearer (TODO 15, closed): Kustomize references the Secret
# but never generates it. With securely generated content every API
# endpoint but the probes requires its bearer; without the Secret the
# pods still start and the API serves loopback clients
# (kubectl port-forward) only. Create or rotate with:
#   kubectl -n simplek8s create secret generic simplek8s-api-token \
#     --from-literal=token="$(openssl rand -hex 32)"
# (rotation needs a DaemonSet restart: the token is read at startup).
apiVersion: v1
kind: Secret
metadata:
  name: simplek8s-api-token
  namespace: simplek8s
type: Opaque
stringData:
  token: CHANGE-ME-generate-securely
