apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# secret.yaml is deliberately NOT a resource: the token Secret must be
# created with securely generated content (see secret.yaml header);
# applying the placeholder would clobber it.
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - daemonset.yaml
  - service.yaml
  - networkpolicy.yaml
