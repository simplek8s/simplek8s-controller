# Image: multi-arch container to GHCR on every branch push. Tests
# gate the push (build job needs test). Docs-only and chart-only
# pushes skip it (no code in the image); releases live in release.yml.
#
# Tags produced (docker/metadata-action):
#   main push    -> main
#   branch push  -> <branch>
name: image

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "assets/**"
      - "chart/**"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./... -count=1

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # lfs:true is load-bearing: the Dockerfile ADDs
      # keys/simplek8s-pubring.gpg, which is Git-LFS tracked. Without
      # it the build would embed the pointer file, not the keyring.
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/simplek8s/simplek8s-controller
          tags: |
            type=ref,event=branch
      - id: stamped
        run: echo "BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
            BUILT=${{ steps.stamped.outputs.BUILT }}
