# Image: multi-arch container to GHCR on every branch push and on
# version tags. Tests gate the push (build job needs test).
#
# Tags produced (docker/metadata-action):
#   main push    -> main
#   branch push  -> <branch>
#   vX.Y.Z tag   -> X.Y.Z, X.Y, X, latest
# On top of the image, a v* tag also creates the GitHub Release
# (auto-generated notes + static amd64/arm64 binaries).
name: image

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./... -count=1

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # lfs:true is load-bearing: the Dockerfile ADDs
      # keys/simplek8s-pubring.gpg, which is Git-LFS tracked. Without
      # it the build would embed the pointer file, not the keyring.
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/simplek8s/simplek8s-controller
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - id: stamped
        run: echo "BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
            COMMIT=${{ github.sha }}
            BUILT=${{ steps.stamped.outputs.BUILT }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: static binaries
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build \
              -ldflags "-X main.version=${{ github.ref_name }} -X main.commit=${{ github.sha }}" \
              -o dist/simplek8s-controller-linux-$arch ./cmd/simplek8s-controller
          done
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*

  chart:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Chart version is the release discipline: vX.Y.Z must ship
      # chart version X.Y.Z (fail loud, no auto-mutation).
      - name: chart version matches tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          got=$(grep '^version:' chart/Chart.yaml | awk '{print $2}')
          test "$got" = "$want" || { echo "chart version $got != tag $want"; exit 1; }
      - run: helm package ./chart
      - run: helm push "simplek8s-controller-${GITHUB_REF_NAME#v}.tgz" oci://ghcr.io/simplek8s/charts
