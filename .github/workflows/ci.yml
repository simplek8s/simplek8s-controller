# CI: vet + test + build on every branch push and PR.
# No registry writes here; image publishing lives in image.yml.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt check
        run: test -z "$(gofmt -l internal/ cmd/)"
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: go build ./...
