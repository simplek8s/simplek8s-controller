# PROD canary overlay (arm64 pilot, rpi4-node only).
# Applies the base manifests scoped to a single node with a fully
# inert configuration (update-mode off, empty windows). Usage:
#   kubectl --context <prod> apply -k deploy/overlays/prod-canary
# Token Secret must exist first (see deploy/secret.yaml header).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../deploy
images:
  - name: ghcr.io/simplek8s/simplek8s-controller
    newTag: dev-arm64
patches:
  - target:
      kind: DaemonSet
      name: simplek8s-controller
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: rpi4-node
  - target:
      kind: ConfigMap
      name: simplek8s-controller
    patch: |-
      - op: replace
        path: /data/updates.url
        value: "https://dl.simplek8s.org/simplek8s/dev/"
